# /etc/zabbix/zabbix_agent2.d/helios-suivi.conf — sondes du portail de suivi (projet, E8)
# Code HTTP de etat.json (attendu : 200 ; 000 si le portail ne répond pas en 5 s)
UserParameter=helios.suivi.http,/usr/bin/curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8080/etat.json
# Âge de etat.json en secondes (attendu : < 300). Nécessite --x pour zabbix sur www (E2.3).
UserParameter=helios.suivi.age,echo $(( $(/usr/bin/date +%s) - $(/usr/bin/stat -c %Y /srv/helios/suivi/www/etat.json) ))
